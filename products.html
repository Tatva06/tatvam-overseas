<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23059669' width='100' height='100' rx='15'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial, sans-serif' font-weight='bold'>T</text></svg>">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Inventory | Tatvam Overseas Inc</title>
    <meta name="description" content="Browse our complete inventory of SS 304, 316, Inconel, Monel, and Alloy Steel. Real-time stock availability in Mumbai.">
    <link rel="canonical" href="https://tatvamoverseasinc.com/products.html">
    
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css"/>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Steel Products Inventory",
      "description": "Catalog of Stainless Steel, Carbon Steel, and Nickel Alloys.",
      "url": "https://tatvamoverseasinc.com/products.html"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Tatvam Overseas Inc",
      "url": "https://tatvamoverseasinc.com",
      "telephone": "+919082834775",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "39/41, Kamal Building, 1st Kumbharwada Lane",
        "addressLocality": "Mumbai",
        "postalCode": "400004",
        "addressCountry": "IN"
      },
      "description": "ISO 9001:2015 certified stockist and exporter of stainless steel, carbon steel, and high nickel alloys."
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-700 font-sans flex flex-col min-h-screen">

    <!-- Header (rendered by components.js) -->
    <header id="site-header" class="sticky top-0 z-50 bg-slate-900 shadow-xl transition-all duration-300"></header>

    <div class="flex flex-col lg:flex-row flex-grow relative">
        
        <aside class="w-full lg:w-72 bg-white border-r border-slate-200 lg:h-[calc(100vh-72px)] lg:sticky lg:top-[72px] overflow-y-auto shrink-0 z-30 shadow-sm">
            <div class="p-6">
                <div class="mb-8">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="layers" class="w-4 h-4"></i> Material Grade
                    </h3>
                    <div class="space-y-1" id="dept-filters"></div>
                </div>
                
                <div class="mb-8">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="box" class="w-4 h-4"></i> Product Form
                    </h3>
                    <div class="space-y-1" id="category-filters"></div>
                </div>

                <div class="pt-6 border-t border-slate-100">
                    <a href="assets/TatvamOverseasInc_Catalog_2025.pdf" class="flex items-center gap-2 text-sm font-bold text-emerald-600 hover:text-emerald-700 p-3 bg-emerald-50 rounded-lg border border-emerald-100 transition-colors">
                        <i data-lucide="download" class="w-4 h-4"></i> Download Catalog PDF
                    </a>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-6 lg:p-10">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                <div>
                    <h1 class="text-3xl font-black text-slate-900">Full Inventory</h1>
                    <p class="text-slate-500 text-sm mt-1">Showing <span id="count-display" class="font-bold text-emerald-600">0</span> items ready for dispatch</p>
                </div>
                
                <div class="relative w-full md:w-80">
                    <input type="text" id="search-input" 
                           placeholder="Search (e.g. 316, P11, Monel)..." 
                           class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500 shadow-sm transition-all text-sm">
                    <i data-lucide="search" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                    
                    <div id="autocomplete" class="absolute top-full left-0 right-0 bg-white border border-slate-200 rounded-b-lg shadow-xl z-50 max-h-96 overflow-y-auto hidden">
                        <!-- Autocomplete results -->
                    </div>
                
            </div>

            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>

        </main>
    </div>

    <div id="common-modal" class="modal-overlay">
        <div class="modal-content p-0 relative overflow-hidden bg-white rounded-xl shadow-2xl max-w-4xl w-full mx-4">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-50 bg-white/80 p-2 rounded-full hover:bg-slate-100 transition-colors" aria-label="Close modal">
                <i data-lucide="x" class="w-6 h-6 text-slate-600"></i>
            </button>
            <div id="modal-body"></div>
        </div>
    </div>


    <script>
        // Initialize Filters
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof products === 'undefined') return;
            
            // Unique Departments
            const depts = ['All', ...new Set(products.map(p => p.department))];
            document.getElementById('dept-filters').innerHTML = depts.map(d => `
                <button onclick="setDept('${d}')" class="dept-btn w-full text-left px-3 py-2 rounded text-sm font-medium transition-colors ${d === currentDept ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}">${d}</button>
            `).join('');

            // Unique Categories
            const cats = ['All', ...new Set(products.map(p => p.category))];
            document.getElementById('category-filters').innerHTML = cats.map(c => `
                <button onclick="setCat('${c}')" class="cat-btn w-full text-left px-3 py-2 rounded text-sm font-medium transition-colors ${c === currentCat ? 'bg-emerald-50 text-emerald-700 font-bold border border-emerald-100' : 'text-slate-600 hover:bg-slate-100'}">${c}</button>
            `).join('');

            renderGrid();
        });

        // Simple Filter State
        const urlParams = new URLSearchParams(window.location.search);
        let currentDept = urlParams.get('dept') || 'All';
        let currentCat = urlParams.get('cat') || 'All';

        function setDept(d) {
            currentDept = d;
            updateActiveBtn('dept-btn', d, 'bg-slate-900 text-white');
            renderGrid();
        }

        function setCat(c) {
            currentCat = c;
            updateActiveBtn('cat-btn', c, 'bg-emerald-50 text-emerald-700 font-bold border border-emerald-100');
            renderGrid();
        }

        function updateActiveBtn(cls, val, activeClasses) {
            document.querySelectorAll('.' + cls).forEach(btn => {
                if(btn.innerText === val) {
                    btn.className = `${cls} w-full text-left px-3 py-2 rounded text-sm font-medium transition-colors ${activeClasses}`;
                } else {
                    btn.className = `${cls} w-full text-left px-3 py-2 rounded text-sm font-medium transition-colors text-slate-600 hover:bg-slate-100`;
                }
            });
        }

        function renderGrid() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('product-grid');
            
            const filtered = products.filter(p => {
                const matchDept = currentDept === 'All' || p.department === currentDept;
                const matchCat = currentCat === 'All' || p.category === currentCat;
                const matchSearch = !search || p.grade.toLowerCase().includes(search) || p.description.toLowerCase().includes(search);
                return matchDept && matchCat && matchSearch;
            });

            document.getElementById('count-display').innerText = filtered.length;

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400">No products match your search.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-xl border border-slate-200 hover:border-emerald-500 hover:shadow-lg transition-all group cursor-pointer overflow-hidden flex flex-col relative h-max" onclick="openProductModal('${p.id}')" itemscope itemtype="https://schema.org/Product">
                    <meta itemprop="name" content="${p.grade}">
                    <meta itemprop="description" content="${p.description}">
                    <div class="h-48 bg-slate-100 relative">
                        <img src="${getProductImage(p)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" alt="${p.grade}" itemprop="image">
                        <div class="absolute top-3 left-3 bg-slate-900/90 text-white text-[10px] font-bold px-2 py-1 rounded backdrop-blur">${p.category}</div>
                    </div>
                    <div class="p-5 flex flex-col">
                        <div class="mb-3">
                            <h3 class="text-lg font-bold text-slate-900 leading-tight group-hover:text-emerald-700 transition-colors">${p.grade}</h3>
                            <div class="flex flex-wrap gap-2 mt-2">
                                <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-200">${p.specs?.standards?.[0] || 'ASTM'}</span>
                                <span class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-100">${p.department}</span>
                            </div>
                        </div>
                        <p class="text-sm text-slate-500 line-clamp-2 mb-4">${p.description}</p>
                        <div class="border-t border-slate-100 pt-3 flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400 uppercase">Details</span>
                            <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-all"><i data-lucide="arrow-right" class="w-4 h-4"></i></div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        document.getElementById('search-input').addEventListener('input', renderGrid);
    </script>
    <!-- Footer (rendered by components.js) -->
    <footer id="site-footer" class="bg-slate-900 text-slate-400 font-sans border-t-4 border-emerald-600"></footer>
    <script src="js/components.js"></script>
    <script src="js/data.js"></script>
    <!-- <script src="js/blog-data.js"></script> -->
    <script src="js/script.js"></script>
</body>
</html>
