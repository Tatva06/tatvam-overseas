<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header (rendered by components.js) -->
    <header id="site-header" class="sticky top-0 z-50 transition-all duration-300" role="banner"></header>
    <section class="bg-slate-900 pt-16 pb-24 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-emerald-600/10 rounded-full blur-3xl opacity-50">
        </div>

        <div class="container mx-auto px-6 relative z-10">
            <div class="text-center mb-12" data-aos="fade-up">
                <h1 class="text-4xl md:text-6xl font-black text-white mb-4">Insights & <span
                        class="text-emerald-400">Market Intelligence</span></h1>
                <p class="text-slate-400 max-w-2xl mx-auto text-lg">Expert analysis on stainless steel grades, global
                    market trends, and technical guides for engineers.</p>
            </div>

            <div id="featured-post-container" class="relative group cursor-pointer" data-aos="zoom-in">
            </div>
        </div>
    </section>

    <section class="sticky top-[72px] z-40 bg-slate-50/90 backdrop-blur-md border-b border-slate-200 py-4 shadow-sm">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="overflow-x-auto w-full md:w-auto pb-2 md:pb-0 no-scrollbar">
                <div class="flex gap-2 min-w-max" id="blog-filters">
                    <button onclick="filterBlogs('All')" data-category="All"
                        class="filter-btn border px-5 py-2 rounded-full text-sm font-bold bg-slate-900 text-white border-slate-900 transition-all">All
                        Posts</button>
                    <button onclick="filterBlogs('Technical Guide')" data-category="Technical Guide"
                        class="filter-btn border px-5 py-2 rounded-full text-sm font-bold bg-white text-slate-600 border-slate-200 hover:bg-slate-50 transition-all">Technical
                        Guides</button>
                    <button onclick="filterBlogs('Market Trends')" data-category="Market Trends"
                        class="filter-btn border px-5 py-2 rounded-full text-sm font-bold bg-white text-slate-600 border-slate-200 hover:bg-slate-50 transition-all">Market
                        Trends</button>
                    <button onclick="filterBlogs('Corrosion Science')" data-category="Corrosion Science"
                        class="filter-btn border px-5 py-2 rounded-full text-sm font-bold bg-white text-slate-600 border-slate-200 hover:bg-slate-50 transition-all">Corrosion
                        Science</button>
                    <button onclick="filterBlogs('Fabrication')" data-category="Fabrication"
                        class="filter-btn border px-5 py-2 rounded-full text-sm font-bold bg-white text-slate-600 border-slate-200 hover:bg-slate-50 transition-all">Fabrication</button>
                    <button onclick="filterBlogs('Aesthetics')" data-category="Aesthetics"
                        class="filter-btn border px-5 py-2 rounded-full text-sm font-bold bg-white text-slate-600 border-slate-200 hover:bg-slate-50 transition-all">Aesthetics</button>
                </div>
            </div>
            <div class="relative w-full md:w-72 shrink-0">
                <input type="text" id="blog-search" onkeyup="searchBlogs()" placeholder="Search articles..."
                    class="w-full bg-white border border-slate-200 shadow-sm rounded-full px-5 py-2 pl-10 text-sm focus:ring-2 focus:ring-emerald-500 outline-none text-slate-700 font-medium">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-4 top-2.5"></i>
            </div>
        </div>
    </section>

    <section class="py-16 bg-slate-50 min-h-screen">
        <div class="container mx-auto px-6">
            <div id="blog-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>

            <div id="no-results" class="hidden text-center py-20">
                <div class="inline-block p-4 rounded-full bg-slate-100 mb-4"><i data-lucide="search-x"
                        class="w-8 h-8 text-slate-400"></i></div>
                <h3 class="text-xl font-bold text-slate-900">No articles found</h3>
                <p class="text-slate-500">Try selecting a different category.</p>
            </div>
        </div>

    <!-- Footer (rendered by components.js) -->
    <footer id="site-footer" class="bg-slate-900 text-slate-400 font-sans border-t-4 border-emerald-600 mt-20"></footer>

    <div id="common-modal" class="modal-overlay">
        <div class="modal-content relative"><button onclick="closeModal()"
                class="absolute top-4 right-4 z-50 text-slate-600 hover:text-slate-900 bg-white/90 backdrop-blur shadow-md hover:shadow-lg p-2 rounded-full transition-all border border-slate-200"><i
                    data-lucide="x" class="w-6 h-6"></i></button>
            <div id="modal-body" class="w-full h-full"></div>
        </div>
    </div>

    <!-- Load data scripts FIRST, then init logic -->
    <script src="js/components.js"></script>
    <script src="js/data.js"></script>
    <script src="js/blog-data.js"></script>
    <script src="js/script.js"></script>

    <script>
        // Inline logic for Blog Page Only (Initialization)
        window.addEventListener('load', () => {
            if (typeof blogs !== 'undefined' && blogs.length > 0) {
                // 1. Render Featured Post
                const featured = blogs.find(b => b.featured) || blogs[0];
                const featContainer = document.getElementById('featured-post-container');
                if (featContainer && featured) {
                    const style = typeof getCategoryStyle === 'function' ? getCategoryStyle(featured.category) : { bg: 'bg-emerald-100', text: 'text-emerald-700' };
                    featContainer.innerHTML = `
                        <div class="bg-white rounded-2xl overflow-hidden shadow-2xl flex flex-col md:flex-row h-auto md:h-[420px]" onclick="openBlogModal('${featured.id}')">
                            <div class="md:w-1/2 h-64 md:h-full relative overflow-hidden group-hover:scale-100">
                                <img src="${featured.image}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-slate-900/20 to-transparent md:hidden"></div>
                                <div class="absolute top-4 left-4 bg-amber-500 text-white text-[10px] uppercase tracking-widest font-black px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 z-10">
                                    <i data-lucide="star" class="w-3 h-3"></i> FEATURED
                                </div>
                            </div>
                            <div class="md:w-1/2 p-8 md:p-12 flex flex-col justify-center bg-white relative z-10 border-l border-slate-100">
                                <div class="flex items-center gap-3 mb-5 text-xs font-bold">
                                    <span class="px-3 py-1 rounded-full ${style.bg} ${style.text}">${featured.category}</span>
                                    <span class="text-slate-300">•</span>
                                    <span class="text-slate-500 flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${featured.readingTime || '5 min read'}</span>
                                </div>
                                <h2 class="text-3xl md:text-4xl font-black text-slate-900 mb-4 group-hover:text-emerald-600 transition-colors leading-tight">${featured.title}</h2>
                                <p class="text-slate-600 mb-8 text-base md:text-lg line-clamp-3 leading-relaxed">${featured.snippet}</p>
                                <div class="flex items-center text-emerald-600 font-bold group-hover:translate-x-2 transition-transform uppercase text-sm tracking-wider">
                                    Read Full Article <i data-lucide="arrow-right" class="ml-2 w-5 h-5"></i>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // 2. Render Grid
                filterBlogs('All');
            }
        });

        function renderBlogCards(posts) {
            const grid = document.getElementById('blog-grid');
            const noResults = document.getElementById('no-results');

            if (posts.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = posts.map((post, index) => {
                const style = typeof getCategoryStyle === 'function' ? getCategoryStyle(post.category) : { bg: 'bg-emerald-100', text: 'text-emerald-700', dot: 'bg-emerald-500' };
                return `
                <article class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 hover:shadow-xl hover:border-emerald-200 transition-all duration-300 group cursor-pointer h-full flex flex-col" onclick="openBlogModal('${post.id}')" data-aos="fade-up" data-aos-delay="${(index % 3) * 50}">
                    <div class="h-56 relative overflow-hidden">
                        <img src="${post.image}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <div class="absolute bottom-4 left-4 ${style.bg} ${style.text} px-3 py-1 rounded-full text-[10px] uppercase tracking-wider font-bold shadow-sm flex items-center gap-1.5 backdrop-blur-md">
                                <div class="w-1.5 h-1.5 rounded-full ${style.dot}"></div>
                                ${post.category}
                            </div>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <div class="text-[11px] font-bold text-slate-400 mb-3 flex items-center gap-3 uppercase tracking-wider">
                            <span class="flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${post.date}</span>
                            <span>•</span>
                            <span class="flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${post.readingTime || '5 MIN'}</span>
                        </div>
                        <h3 class="text-xl font-black text-slate-900 mb-3 group-hover:text-emerald-600 transition-colors leading-snug">${post.title}</h3>
                        <p class="text-slate-600 text-sm flex-grow line-clamp-3 mb-6 leading-relaxed">${post.snippet}</p>
                        <div class="text-emerald-600 font-bold text-xs uppercase tracking-wider flex items-center mt-auto group-hover:translate-x-2 transition-transform">
                            Read Article <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>
                        </div>
                    </div>
                </article>
                `;
            }).join('');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        let currentCategory = 'All';

        function filterBlogs(category) {
            currentCategory = category;
            const btns = document.querySelectorAll('.filter-btn');

            // UI: Update active button
            btns.forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.classList.add('bg-slate-900', 'text-white', 'border-slate-900');
                    btn.classList.remove('bg-white', 'text-slate-600', 'hover:bg-slate-50', 'border-slate-200');
                } else {
                    btn.classList.remove('bg-slate-900', 'text-white', 'border-slate-900');
                    btn.classList.add('bg-white', 'text-slate-600', 'hover:bg-slate-50', 'border-slate-200');
                }
            });

            applyFilters();
        }

        function searchBlogs() {
            applyFilters();
        }

        function applyFilters() {
            const searchTerm = (document.getElementById('blog-search').value || '').toLowerCase();

            let filtered = blogs;

            if (currentCategory === 'All' && searchTerm === '') {
                const featuredId = (blogs.find(b => b.featured) || blogs[0]).id;
                filtered = blogs.filter(b => b.id !== featuredId);
            } else if (currentCategory !== 'All') {
                filtered = blogs.filter(b => b.category === currentCategory);
            }

            if (searchTerm !== '') {
                filtered = filtered.filter(b =>
                    b.title.toLowerCase().includes(searchTerm) ||
                    b.snippet.toLowerCase().includes(searchTerm) ||
                    (b.keywords && b.keywords.some(k => k.toLowerCase().includes(searchTerm)))
                );
            }

            renderBlogCards(filtered);
        }
    </script>
