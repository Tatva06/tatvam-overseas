<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" width="360" height="130" fill="none">
    <defs>
        <!-- Emerald Green for T and I blocks -->
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="50%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <!-- Platinum White for O ring -->
        <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
        </linearGradient>
        <!-- Subtle glow for emerald blocks -->
        <filter id="emeraldGlow">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.5"/>
        </filter>
        <!-- Subtle shadow for O -->
        <filter id="platinumGlow">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#94a3b8" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- ===== T (left) ===== -->
    <!-- T top horizontal bar -->
    <rect x="2" y="8" width="110" height="38" rx="6" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)"/>
    <!-- T bottom vertical stem (centered under bar) -->
    <rect x="38" y="54" width="38" height="68" rx="6" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)"/>

    <!-- ===== O (center) — rectangular ring shape like original ===== -->
    <!-- Outer frame top -->
    <rect x="122" y="8" width="116" height="38" rx="6" fill="url(#platinumGrad)" filter="url(#platinumGlow)"/>
    <!-- Outer frame bottom -->
    <rect x="122" y="84" width="116" height="38" rx="6" fill="url(#platinumGrad)" filter="url(#platinumGlow)"/>
    <!-- Outer frame left side -->
    <rect x="122" y="8" width="28" height="114" rx="6" fill="url(#platinumGrad)" filter="url(#platinumGlow)"/>
    <!-- Outer frame right side -->
    <rect x="210" y="8" width="28" height="114" rx="6" fill="url(#platinumGrad)" filter="url(#platinumGlow)"/>

    <!-- ===== I (right) ===== -->
    <!-- I top horizontal bar -->
    <rect x="248" y="8" width="110" height="38" rx="6" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)"/>
    <!-- I bottom vertical stem (centered under bar) -->
    <rect x="284" y="54" width="38" height="68" rx="6" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)"/>
</svg>
